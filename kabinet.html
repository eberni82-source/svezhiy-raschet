<body>
<title>Кабинет «Свежий расчёт»</title>
<meta name="description" content="Личный кабинет заведения: план на день, витрина, итоги, товары и сроки годности.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #FAF9F6; --surface: #FFFFFF; --ink: #211B16; --ink-2: #5E554C; --ink-3: #8A8077; --line: #E4DFD7;

  --stamp: #2346C8; --stamp-ink: #FFFFFF; --stamp-soft: #E7ECFB;
  --ok: #2B7A4B; --ok-soft: #E2F1E7; --warn: #9A6210; --warn-soft: #F6ECD8; --bad: #B3371F; --bad-soft: #F8E3DE;
  --shadow: 0 1px 0 rgba(33,27,22,.06), 0 12px 28px -14px rgba(33,27,22,.28);
  --f-display: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120F; --surface: #1D1915; --ink: #F1EBE3; --ink-2: #B9AFA4; --ink-3: #8E847A; --line: #352E28;
    --kraft: #2E261D; --kraft-2: #3A3025; --kraft-ink: #EBDCC0; --paper: #F4EFE4;
    --stamp: #93A8FF; --stamp-ink: #0E1533; --stamp-soft: #222A4C;
    --ok: #6CC08F; --ok-soft: #1C3326; --warn: #E3AB4E; --warn-soft: #3A2C14; --bad: #F2907A; --bad-soft: #3E211A;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 30px -12px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15120F; --surface: #1D1915; --ink: #F1EBE3; --ink-2: #B9AFA4; --ink-3: #8E847A; --line: #352E28;
  --kraft: #2E261D; --kraft-2: #3A3025; --kraft-ink: #EBDCC0; --paper: #F4EFE4;
  --stamp: #93A8FF; --stamp-ink: #0E1533; --stamp-soft: #222A4C;
  --ok: #6CC08F; --ok-soft: #1C3326; --warn: #E3AB4E; --warn-soft: #3A2C14; --bad: #F2907A; --bad-soft: #3E211A;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 30px -12px rgba(0,0,0,.7); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); margin: 0; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, table, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }

/* шапка */

.top-in { display: flex; align-items: center; gap: 12px 20px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; margin-right: auto; min-width: 0; }
.brand-name { font: 700 18px/1.1 var(--f-display); }
.brand small { display: block; font: 500 13px/1.2 var(--f-body); opacity: .8; }
.clock { font: 600 14px var(--f-mono); white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 999px; font: 600 14px/1 var(--f-body); border: 1.5px solid transparent; cursor: pointer; text-decoration: none; background: none; color: inherit; white-space: nowrap; }
.btn-primary { background: var(--stamp); color: var(--stamp-ink); }
.btn-ghost { border-color: currentColor; }
.btn-quiet { color: var(--ink-2); border-color: var(--line); background: var(--surface); }
.btn-quiet:hover { color: var(--ink); border-color: var(--ink-3); }
.btn-danger { color: var(--bad); border-color: var(--bad-soft); background: var(--surface); }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }


/* лента дня */

.day-head .upd { font-size: 13px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.ribbon { position: relative; display: grid; grid-template-columns: var(--cols); gap: 4px; }
.seg { position: relative; text-align: left; border: 0; cursor: pointer; padding: 10px 12px 9px; border-radius: 10px; background: var(--bg); color: var(--ink-2); font: 500 13px/1.25 var(--f-body); min-width: 0; }
.seg b { display: block; font: 600 15px/1.2 var(--f-body); color: var(--ink); }
.seg .t { font: 600 12px var(--f-mono); color: var(--ink-3); }
.seg.past { opacity: .62; }
.seg.now { background: var(--stamp-soft); }
.seg.now b { color: var(--stamp); }
.seg[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--stamp); }
.now-tag { font: 700 12.5px/1 var(--f-mono); background: var(--stamp); color: var(--stamp-ink); padding: 3px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; }
.track { position: relative; height: 4px; background: var(--line); border-radius: 2px; margin-top: 10px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--stamp); border-radius: 2px; }
.track span { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--stamp); border: 2px solid var(--surface); transform: translate(-50%, -50%); }
.seg { overflow: hidden; }
.hint .mono { overflow-wrap: anywhere; }
@media (max-width: 620px) {
  .ribbon { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
  .seg { padding: 8px; } .seg .desc { display: none; }
  .now-tag { display: table; margin: 3px 0 2px; }
}

/* вкладки */

.tabs button { border: 0; background: none; font: 600 15px/1 var(--f-body); color: var(--ink-3); padding: 12px 12px 14px; cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--stamp); }
.tabs .cnt { font: 600 11px var(--f-mono); background: var(--bad-soft); color: var(--bad); border-radius: 999px; padding: 2px 6px; margin-left: 4px; }

.view { padding-bottom: 56px; display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }

.card .sub { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.kpi b { display: block; font: 700 30px/1.05 var(--f-display); }
.kpi span { color: var(--ink-2); font-size: 13px; }
.kpi.warn b { color: var(--warn); }
.kpi.bad b { color: var(--bad); }

.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.t th { text-align: left; font: 600 12.5px/1.2 var(--f-mono); color: var(--ink-3); padding: 0 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 11px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; white-space: nowrap; }
.t .name { font-weight: 600; }
.t .why { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.t .big { font: 700 20px/1 var(--f-mono); }
.t .muted { color: var(--ink-3); }
.t tfoot td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--f-body); padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.new { background: var(--stamp-soft); color: var(--stamp); }
.chip.mute { background: var(--bg); color: var(--ink-3); }

input[type="text"], input[type="number"], input[type="date"], input[type="time"], select {
  font: 500 15px/1.2 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0; }
input.small { width: 84px; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-3); min-width: 0; }
.form .wide { grid-column: span 2; }
@media (max-width: 520px) { .form .wide { grid-column: auto; } }
.err { color: var(--bad); font-weight: 600; font-size: 14px; }
.hint { font-size: 13px; color: var(--ink-3); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.slots { display: flex; gap: 4px; flex-wrap: wrap; }
.slot { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: 500 12.5px/1 var(--f-body); padding: 8px 9px; border-radius: 8px; cursor: pointer; min-height: 32px; }
.slot:hover { border-color: var(--ink-3); color: var(--ink); }
.left-in { display: flex; gap: 4px; align-items: center; }
.left-in input { width: 70px; min-height: 32px; padding: 5px 8px; }
.progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.progress i { display: block; height: 100%; background: var(--ok); }
.removed { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { padding: 26px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.cmp { display: grid; grid-template-columns: 110px minmax(0, 1fr) 100px; gap: 8px; align-items: center; font-size: 14px; margin-top: 6px; }
.cmp .bar { height: 12px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.cmp .bar i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.cmp .v { text-align: right; font: 600 14px var(--f-mono); }

/* вход */
.login { max-width: 440px; margin: 48px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.login h1 { font: 700 26px/1.15 var(--f-display); }
.login ol { margin: 0; padding-left: 20px; color: var(--ink-2); display: grid; gap: 6px; }
.code-in { font: 600 26px/1 var(--f-mono) !important; letter-spacing: .3em; text-align: center; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.loading { padding: 60px 0; text-align: center; color: var(--ink-3); }
</style>

<script>// модель прогноза, та же что в bot/core/forecast.py
(function (root) {
  "use strict";
  var WD = ["понедельник", "вторник", "среда", "четверг", "пятница", "суббота", "воскресенье"];
  var WDS = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];
  var DEFAULT_RAIN = -0.10, SHARE_EVENING = 0.22, DISCOUNT_K = 1.2;

  // даты как номера дней (UTC), чтобы не зависеть от часового пояса
  function dnum(iso) { var p = iso.split("-"); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  function diso(n) { return new Date(n * 864e5).toISOString().slice(0, 10); }
  function wday(n) { return (new Date(n * 864e5).getUTCDay() + 6) % 7; }
  function ddmm(n) { var s = diso(n); return s.slice(8, 10) + "." + s.slice(5, 7); }

  function parseTime(s) {
    if (!s) return null;
    s = String(s).trim().replace(".", ":");
    if (s.indexOf(":") < 0) return null;
    var p = s.split(":"), h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    return h + m / 60;
  }
  function demand(s, oh, ch) {
    oh = oh == null ? 7 : oh; ch = ch == null ? 21 : ch;
    var t = parseTime(s.soldout);
    if (t == null) return s.sold;
    var f = Math.min(1, Math.max(0, (t - oh) / (ch - oh)));
    return s.sold * (1 + 0.5 * (1 - f));
  }
  function rainEffect(sales) {
    var dry = {}, ratios = [];
    sales.forEach(function (s) {
      if (s.rain === false) { var k = s.product + "|" + wday(s.day); (dry[k] = dry[k] || []).push(demand(s)); }
    });
    sales.forEach(function (s) {
      if (s.rain === true) {
        var d = dry[s.product + "|" + wday(s.day)];
        if (d && d.length >= 2) {
          var b = d.reduce(function (a, x) { return a + x; }, 0) / d.length;
          if (b > 0) ratios.push(demand(s) / b);
        }
      }
    });
    if (ratios.length < 3) return { eff: DEFAULT_RAIN, learned: false };
    var e = ratios.reduce(function (a, x) { return a + x; }, 0) / ratios.length - 1;
    return { eff: Math.max(-0.35, Math.min(0.2, e)), learned: true };
  }
  function criticalRatio(price, cost) {
    if (!price || cost == null || price <= 0) return 0.6;
    return Math.max(0.3, Math.min(0.95, (price - cost) / price));
  }
  // обратная функция нормального распределения (Acklam)
  function invNorm(p) {
    var a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239],
        b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572],
        c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783],
        d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416], q, r;
    if (p < 0.02425) { q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    if (p > 1 - 0.02425) { q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    q = p - 0.5; r = q * q;
    return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
  }
  function signed(x) { var v = Math.round(x); return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v) + "%"; }

  function avg(xs) { return xs.reduce(function (a, x) { return a + x; }, 0) / xs.length; }
  function signedDeg(x) { return Math.abs(Math.round(x)) + "°"; }
  var TEMP_WINDOW = 365, TEMP_NEAR = 15, TEMP_MIN_DAYS = 60, TEMP_MIN_T = 2.5;

  // на сколько (доля) меняется спрос на каждый градус; 0 - если данных мало или связь ненадёжна
  function temperatureSlope(hist, target, cleanValue, wf) {
    var N = TEMP_WINDOW, y = new Array(N + 1).fill(null), tt = new Array(N + 1).fill(null);
    hist.forEach(function (s) {
      var age = target - s.day;
      if (age >= 1 && age <= N) {
        var f = wf(wday(s.day)) || 1;
        y[age] = (y[age] || 0) + cleanValue(s) / f;
        if (s.temp != null) tt[age] = s.temp;
      }
    });
    function prefix(arr) {
      var sums = [0], cnts = [0];
      arr.forEach(function (v) { sums.push(sums[sums.length - 1] + (v != null ? v : 0)); cnts.push(cnts[cnts.length - 1] + (v != null ? 1 : 0)); });
      return [sums, cnts];
    }
    var py = prefix(y), pt = prefix(tt), xs = [], rs = [];
    for (var age = 1; age <= N; age++) {
      if (y[age] == null || tt[age] == null) continue;
      var lo = Math.max(0, age - TEMP_NEAR), hi = Math.min(N, age + TEMP_NEAR) + 1;
      if (py[1][hi] - py[1][lo] === 0 || pt[1][hi] - pt[1][lo] === 0) continue;
      var localY = (py[0][hi] - py[0][lo]) / (py[1][hi] - py[1][lo]);
      var localT = (pt[0][hi] - pt[0][lo]) / (pt[1][hi] - pt[1][lo]);
      if (localY > 0) { xs.push(tt[age] - localT); rs.push(y[age] / localY); }

  function render() {
    if (!S.st) return;
    renderTop(); renderDay(); renderTabs();
    var v = "";
    if (S.tab === "today") v = S.part === "vitrina" ? viewVitrina() : S.part === "itogi" ? viewItogi() : viewPlan();
    else if (S.tab === "tomorrow") v = viewTomorrow();
    else if (S.tab === "products") v = viewProducts();
    else if (S.tab === "batches") v = viewBatches();
    else v = viewData();
    $("view").innerHTML = v;
  }
  function refresh(force) {
    if (!force && (S.busy || isTyping())) return Promise.resolve();
    return API.state().then(function (st) {
      S.st = st; S.offset = serverOffset(st.now); S.fetchedAt = Date.now();
      var cur = PART_OF[phaseOf(st.times, nowMinutes().m)];
      if (!S.part || !S.partManual) S.part = cur;
      $("loading").hidden = true; $("login").hidden = true; $("app").hidden = false;
      render();
    }).catch(function (e) {
      if (e && e.login) return showLogin();
      $("loading").textContent = "Не удалось загрузить кабинет: " + (e && e.message ? e.message : e);
    });
  }
  function isTyping() {
    var a = document.activeElement;
    return a && $("view").contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.type !== "file";
  }
  function post(path, body, okMsg) {
    S.busy = true;
    return API.post(path, body).then(function (r) {
      S.busy = false; if (okMsg) toast(okMsg);
      return refresh(true).then(function () { return r; });
    }).catch(function (e) {
      S.busy = false;
      if (e && e.login) return showLogin();
      toast(e && e.message ? e.message : "Не получилось");
      throw e;
    });
  }
  function showLogin() {
    $("loading").hidden = true; $("app").hidden = true; $("login").hidden = false;
    $("top-actions").innerHTML = ""; $("clock").textContent = "";
    var u = "https://t.me/" + BOT_USERNAME;
    $("login-bot").href = u; $("login-bot").textContent = "@" + BOT_USERNAME;
    setTimeout(function () { $("code").focus(); }, 50);
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-part],[data-tab]");
    if (!t) return;
    if (t.hasAttribute("data-tab")) { S.tab = t.getAttribute("data-tab"); S.edit = null; S.confirm = null; render(); return; }
    if (t.hasAttribute("data-part")) { S.part = t.getAttribute("data-part"); S.partManual = true; S.tab = "today"; render(); return; }
    var a = t.getAttribute("data-act"), p = t.getAttribute("data-p");
    if (a === "logout") { API.post("/api/logout").catch(function () {}).then(function () { S.st = null; showLogin(); }); }
    else if (a === "reset") { Local.reset(); S.vitrina = {}; refresh(true).then(function () { toast("Пример восстановлен"); }); }
    else if (a === "soldout") post("/api/record", { product: p, soldout: t.getAttribute("data-t") }, "Отмечено: " + p);
    else if (a === "left") {
      var inp = document.querySelector('[data-left="' + CSS.escape(p) + '"]');
      if (!inp || inp.value === "") { toast("Впишите, сколько осталось"); return; }
      post("/api/record", { product: p, left: inp.value }, "Отмечено: " + p);
    }
    else if (a === "edit") { S.edit = p; S.confirm = null; render(); }
    else if (a === "edit-cancel") { S.edit = null; render(); }
    else if (a === "ask-remove") { S.confirm = p; S.edit = null; render(); }
    else if (a === "ask-example") { S.confirm = "__example"; render(); }
    else if (a === "confirm-cancel") { S.confirm = null; render(); }
    else if (a === "remove") { S.confirm = null; post("/api/product/remove", { name: p }, "Убрано из планов: " + p); }
    else if (a === "restore") post("/api/product/restore", { name: p }, "Вернули: " + p);
    else if (a === "batch") {
      var s = t.getAttribute("data-s");
      post("/api/batch/close", { id: +t.getAttribute("data-id"), status: s }, s === "used" ? "Отмечено: использовано" : s === "written_off" ? "Списание учтено" : "Запись удалена");
    }
    else if (a === "example") { S.confirm = null; S.vitrina = {}; post("/api/example", {}, "Загружен пример пекарни"); }
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.hasAttribute("data-vitrina")) {
      var p = t.getAttribute("data-vitrina"); S.vitrina[p] = t.value;
      var it = S.st.today.items.filter(function (x) { return x.product === p; })[0], cell = document.querySelector('[data-adv="' + CSS.escape(p) + '"]');
      if (it && cell) {
        if (t.value === "") cell.innerHTML = "";
        else { var a = M.discountAdvice({ mean: it.mean }, +t.value); cell.innerHTML = a.pct ? '<span class="chip warn">скидка ' + a.pct + "%</span>" : '<span class="chip ok">без скидки</span>'; }
      }
    }
    if (t.form && t.form.getAttribute("data-form") === "batch-add" && (t.name === "item" || t.name === "made")) {
      var f = t.form, prod = S.st.products.filter(function (x) { return x.name === f.item.value.trim(); })[0];
      if (prod && prod.shelf_life && f.made.value) f.expires.value = M.diso(M.dnum(f.made.value) + prod.shelf_life);
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target, a = t.getAttribute("data-act");
    if (a === "event") post("/api/event", { factor: +t.value }, "Прогноз на завтра обновлён");
    if (a === "upload" && t.files && t.files[0]) {
      var file = t.files[0], rd = new FileReader();
      rd.onload = function () {
        var text;
        try { text = new TextDecoder("utf-8", { fatal: true }).decode(rd.result); } catch (x) { text = new TextDecoder("windows-1251").decode(rd.result); }
        post("/api/upload", { csv: text }).then(function (r) { toast("Загружено строк: " + r.rows); }).catch(function () {});
      };
      rd.readAsArrayBuffer(file); t.value = "";
    }
  });
  document.addEventListener("submit", function (e) {
    var f = e.target, kind = f.getAttribute("data-form");
    if (f.id === "login-form") {
      e.preventDefault();
      var code = $("code").value.replace(/\D/g, "");
      $("login-err").hidden = true;
      API.post("/api/login", { code: code }).then(function () { $("code").value = ""; return refresh(true); })
        .catch(function (x) { $("login-err").textContent = x && x.message ? x.message : "Не получилось войти"; $("login-err").hidden = false; });
      return;
    }
    if (!kind) return;
    e.preventDefault();
    var data = {};
    Array.prototype.forEach.call(f.elements, function (el) { if (el.name) data[el.name] = el.value; });
    if (kind === "product-add") post("/api/product", data, "Товар добавлен: " + data.name).then(function () {}).catch(function () {});
    else if (kind === "product-edit") { data.old_name = f.getAttribute("data-old"); S.edit = null; post("/api/product", data, "Сохранено").catch(function () {}); }
    else if (kind === "batch-add") { if (!data.expires) delete data.expires; post("/api/batch", data, "Партия добавлена").catch(function () {}); }
    else if (kind === "settings") post("/api/settings", data, "Настройки сохранены").catch(function () {});
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.st) refresh(); });

  // часы и смена частей дня
  var lastPhase = null;
  setInterval(function () {
    if (!S.st) return;
    var ph = phaseOf(S.st.times, nowMinutes().m);
    if (lastPhase && ph !== lastPhase) { S.partManual = false; refresh(true); }
    lastPhase = ph;
    renderTop(); renderDay();
  }, 15000);
  setInterval(function () { if (S.st) refresh(); }, 60000);
  API.init().then(function () {
    var m = location.search.match(/[?&]code=(\d{6})/);
    if (API.mode === "server" && m) {
      history.replaceState(null, "", location.pathname);
      return API.post("/api/login", { code: m[1] }).catch(function () {}).then(function () { return refresh(true); });
    }
    return refresh(true);
  });
})();
</script>

</body>
</html>
